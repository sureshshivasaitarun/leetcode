
name: Auto Create Notes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  create-notes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create notes files
        run: |
          for dir in */; do
            [ -d "$dir" ] || continue

            if compgen -G "$dir/*.py" > /dev/null &&
               [ -f "$dir/README.md" ] &&
               [ ! -f "$dir/notes.md" ]; then

              cat > "$dir/notes.md" <<'EOF'
          # Problem Notes

          ## Problem Name

          Write problem name here.

          ## Approach
          Explain your approach.

          ## Concepts Used
          - 

          ## Time Complexity
          O()

          ## Space Complexity
          O()

          ## What I Learned
          - 

          ## Mistakes and Edge Cases
          - 

          ## Revision
          - [ ] Revise this problem
          EOF

            fi
          done

      - name: Commit notes files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Add notes templates for new problems"
            git push
          fi
